<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snap Recomp Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#15171b; --panel:#1d2026; --line:#2e333c; --text:#dfe3ea; --dim:#8b93a1; --acc:#5aa0ff; --ok:#3fb56b; --bad:#e0524f; --warn:#e0a030; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui,Segoe UI,Arial,sans-serif; }
  #app { display:grid; grid-template-columns:300px 1fr; grid-template-rows:1fr auto; height:100vh; }
  #side { grid-row:1 / 3; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #side h1 { font-size:15px; margin:0; padding:12px 14px 4px; }
  #side .sub { padding:0 14px 8px; color:var(--dim); font-size:12px; }
  #filters { display:flex; gap:6px; padding:0 14px 10px; }
  #filters button { flex:1; }
  #list { overflow:auto; flex:1; }
  .item { padding:8px 14px; border-top:1px solid var(--line); cursor:pointer; }
  .item:hover { background:#252931; }
  .item.sel { background:#27334a; }
  .item .n { font-weight:600; }
  .item .m { color:var(--dim); font-size:12px; }
  .badge { display:inline-block; font-size:11px; padding:0 6px; border-radius:8px; margin-left:6px; border:1px solid var(--line); }
  .b-approve { color:var(--ok); border-color:var(--ok); } .b-reject { color:var(--bad); border-color:var(--bad); }
  .b-needs-work { color:var(--warn); border-color:var(--warn); } .b-pending { color:var(--acc); border-color:var(--acc); }
  #main { position:relative; min-height:0; display:flex; flex-direction:column; }
  #bar { display:flex; flex-wrap:wrap; gap:8px 14px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); align-items:center; }
  #bar .grp { display:flex; gap:4px; align-items:center; }
  #bar .lbl { color:var(--dim); font-size:12px; margin-right:2px; }
  button, select, textarea { background:#262a32; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 9px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); border-color:var(--acc); color:#07101e; }
  #stage { position:relative; flex:1; min-height:0; }
  canvas { display:block; width:100%; height:100%; }
  .tag { position:absolute; top:8px; padding:4px 9px; background:rgba(15,17,21,.78); border:1px solid var(--line); border-radius:4px; pointer-events:none; font-size:12px; }
  #tagL { left:8px; } #tagR { right:8px; text-align:right; }
  #div { position:absolute; top:0; bottom:0; left:50%; width:2px; background:rgba(255,255,255,.35); pointer-events:none; }
  #msg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(15,17,21,.85); padding:8px 14px; border-radius:6px; pointer-events:none; }
  #dec { grid-column:2; background:var(--panel); border-top:1px solid var(--line); padding:10px 12px; display:grid; grid-template-columns:1fr 330px; gap:12px; }
  #notes { color:var(--dim); font-size:12px; max-height:90px; overflow:auto; }
  #notes b { color:var(--text); }
  #hist { margin-top:4px; font-size:12px; color:var(--dim); max-height:60px; overflow:auto; }
  #verd { display:flex; gap:6px; margin-bottom:6px; }
  #verd .approve { border-color:var(--ok); } #verd .reject { border-color:var(--bad); } #verd .needs-work { border-color:var(--warn); }
  #verd .approve:hover { background:var(--ok); color:#06150c; } #verd .reject:hover { background:var(--bad); color:#1d0807; } #verd .needs-work:hover { background:var(--warn); color:#1e1402; }
  #comment { width:100%; height:48px; resize:vertical; }
  #saved { color:var(--ok); font-size:12px; height:14px; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>Snap Recomp Studio</h1>
    <div class="sub">Original left, candidate right. Local only.</div>
    <div id="filters"><button data-f="pending" class="on">Pending</button><button data-f="decided">Decided</button><button data-f="all">All</button></div>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="bar">
      <div class="grp"><span class="lbl">Light</span><select id="light">
        <option value="studio">Neutral studio</option><option value="florio">Florio daylight</option><option value="sunset">Sunset</option><option value="night">Night</option><option value="cave">Cave</option></select></div>
      <div class="grp"><span class="lbl">View</span>
        <button data-v="lit" class="on">Lit</button><button data-v="albedo">Albedo</button><button data-v="normals">Normals</button><button data-v="roughness">Roughness</button><button data-v="wire">Wireframe</button></div>
      <div class="grp"><span class="lbl">Distance</span><button data-d="close">Close-up</button><button data-d="mid" class="on">Mid-range</button></div>
      <div class="grp"><button id="turn">Turntable: off</button><button id="reset">Reset camera</button></div>
    </div>
    <div id="stage"><canvas id="cv"></canvas><div id="div"></div>
      <div class="tag" id="tagL"></div><div class="tag" id="tagR"></div><div id="msg" hidden></div></div>
  </div>
  <div id="dec">
    <div><div id="notes"></div><div id="hist"></div></div>
    <div><div id="verd"><button class="approve" data-verdict="approve">Approve</button><button class="reject" data-verdict="reject">Reject</button><button class="needs-work" data-verdict="needs-work">Needs work</button></div>
      <textarea id="comment" placeholder="Comment (optional)"></textarea><div id="saved"></div></div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/examples/jsm/" } }</script>
<script type="module" src="./studio.js"></script>
</body>
</html>
