[package]
name = "snap-level-editor"
version = "0.1.0"
edition = "2021"
description = "Read-only course viewer, milestone 1 of the New Pokemon Snap recomp level editor"
license = "MIT"
publish = false

[[bin]]
name = "level-editor"
path = "src/main.rs"

[dependencies]
# UI and rendering (MIT OR Apache-2.0)
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
egui-wgpu = "0.37"
# math, buffers, PNG output (MIT OR Apache-2.0 / Zlib)
glam = "0.34.3"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.18"
walkdir = "2"
crc32fast = "1"
# SSBH model/mesh/skeleton reader (MIT), the same vendored copy scripts/hd/ssbh_to_gltf uses
ssbh_data = { path = "../ref/ssbh_lib/ssbh_data" }
# raw mesh buffers, for patching ground vertices in place (MIT; half: MIT OR Apache-2.0)
ssbh_lib = { path = "../ref/ssbh_lib/ssbh_lib", default-features = false }
half = "2.1.0"
# scenery import: glTF 2.0 (MIT OR Apache-2.0; buffers are read by our code, no image decoding) and OBJ (MIT)
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
tobj = { version = "4", default-features = false }
# random course: reads the JSON of the separate snap-procgen tool (MIT OR Apache-2.0; already built for gltf)
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
